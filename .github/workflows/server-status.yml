name: Monitor ARK server status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: nitrado-server-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check server status
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
          NITRADO_SERVICE_ID: ${{ secrets.NITRADO_SERVICE_ID }}
        run: |
          if [[ -z "$MONITOR_URL" || -z "$MONITOR_SECRET" || -z "$NITRADO_API_TOKEN" || -z "$NITRADO_SERVICE_ID" ]]; then
            echo "Configure MONITOR_URL, MONITOR_SECRET, NITRADO_API_TOKEN, and NITRADO_SERVICE_ID in GitHub Actions secrets."
            exit 1
          fi
          python -m pip install --disable-pip-version-check python-a2s
          python .github/scripts/report-server-status.py
